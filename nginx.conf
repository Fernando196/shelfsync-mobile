server {
  listen 80;
  root /usr/share/nginx/html;

  # Bundles y assets llevan hash en el nombre: se pueden cachear para siempre.
  location ~ ^/(_expo|assets)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html y manifest sin cache, para que un deploy nuevo llegue al recargar.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
