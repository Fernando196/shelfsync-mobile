<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ShelfSync</title>
    <!-- PWA: open full screen from the home screen, without Safari's UI -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ShelfSync" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* No double-tap zoom */
        touch-action: manipulation;
        /* Same as the app's bg-surface, so Safari's bars blend with the app */
        background-color: #f8fafc;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Feel like a native app: no rubber-band bounce, tap flash or long-press menus */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
        /* The browser ring only wraps the bare <input> (not our styled box) and can
           overflow the screen; focus is shown with the border color instead. */
        outline: none;
      }
      input:focus,
      textarea:focus {
        border-color: #334155 !important;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Dark mode follows the phone's theme (NativeWind dark: uses the same media query) */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #020617;
          color-scheme: dark;
        }
        input:focus,
        textarea:focus {
          border-color: #cbd5e1 !important;
        }
      }
    </style>
    <!-- iOS Safari ignores user-scalable=no, so pinch would zoom the whole app: block it here -->
    <script>
      // Capture phase on window: runs before any app handler can stop the event.
      var opts = { passive: false, capture: true };
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        window.addEventListener(type, function (e) { e.preventDefault(); }, opts);
      });
      ['touchstart', 'touchmove'].forEach(function (type) {
        window.addEventListener(
          type,
          function (e) { if (e.touches.length > 1) e.preventDefault(); },
          opts
        );
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
